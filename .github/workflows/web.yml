# CI web estándar de modular-forge: verifica, compila y despliega en la Pi una web estática.
# Se llama desde el ci.yml de cada proyecto, fijado por SHA. Documentación: README.md.
name: Web

on:
  workflow_call:
    inputs:
      site:
        description: Nombre del sitio en la Pi (/srv/www/<site>; tiene que estar en SITIOS de forge-desplegar)
        type: string
        required: true
      dist:
        description: Carpeta que genera la compilación, por ejemplo dist/portfolio/browser
        type: string
        required: true
      url:
        description: URL pública del sitio, para la comprobación después de desplegar
        type: string
        required: true
      ts-oauth-client-id:
        description: Client ID de la credencial federada de Tailscale (variable TS_OAUTH_CLIENT_ID)
        type: string
        required: true
      ts-audience:
        description: Audience de la credencial federada de Tailscale (variable TS_AUDIENCE)
        type: string
        required: true
      known-hosts:
        description: Línea de known_hosts con la clave de host de la Pi (variable FORGE_KNOWN_HOSTS)
        type: string
        required: true
      deploy-host:
        description: IP de Tailscale de la Pi
        type: string
        default: 100.96.46.94
    secrets:
      DEPLOY_SSH_KEY:
        description: Clave privada SSH del usuario deploy (secreto del entorno production del proyecto)
        required: true

permissions: {}

jobs:
  verify:
    name: Verificar y compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NG_CLI_ANALYTICS: "false" # la CLI de Angular no envía datos de uso desde el CI
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node (versión de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Contrato de scripts: el que no exista en el proyecto se salta.
      - name: ESLint
        run: npm run lint --if-present
      - name: Stylelint
        run: npm run lint:styles --if-present
      - name: Formato (Prettier)
        run: npm run format:check --if-present
      - name: Reglas de dependencias
        run: npm run deps:validate --if-present
      - name: Código sin usar (knip)
        run: npm run knip --if-present
      - name: Cobertura de tipos
        run: npm run type-coverage --if-present
      - name: Tests
        run: npm run test:ci --if-present
      - name: Traducciones
        run: npm run i18n:check --if-present

      - name: Compilar
        run: npm run build

      - name: Comprobar la salida y añadir version.json
        env:
          DIST: ${{ inputs.dist }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f $DIST/index.html ]]; then
            echo "::error::No existe $DIST/index.html: revisa el parámetro dist"
            exit 1
          fi
          if [[ -n $(find "$DIST" -type l) ]]; then
            echo "::error::La salida contiene enlaces simbólicos"
            exit 1
          fi
          jq -n --arg commit "$SHA" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, built: $built}' > "$DIST/version.json"
          echo "Tamaño de la salida: $(du -sh "$DIST" | cut -f1)"

      - name: Guardar la web compilada
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: ${{ inputs.dist }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Desplegar en la Pi
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ inputs.url }}
    concurrency:
      group: despliegue-${{ inputs.site }}
      cancel-in-progress: false
    permissions:
      id-token: write # Tailscale con identidad federada (sin secretos de Tailscale)
    steps:
      - name: Comprobar parámetros y secreto
        env:
          SITE: ${{ inputs.site }}
          SHA: ${{ github.sha }}
          HOST: ${{ inputs.deploy-host }}
          KNOWN_HOSTS: ${{ inputs.known-hosts }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          fallo=0
          [[ $SITE =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "::error::Nombre de sitio no válido: $SITE"; fallo=1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit no válido: $SHA"; fallo=1; }
          [[ $HOST =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::deploy-host no es una IP de Tailscale: $HOST"; fallo=1; }
          [[ $KNOWN_HOSTS == "$HOST ssh-ed25519 "* ]] || { echo "::error::known-hosts no empieza por '$HOST ssh-ed25519'"; fallo=1; }
          [[ -n $KEY ]] || { echo "::error::DEPLOY_SSH_KEY vacío: tiene que existir en el entorno production del proyecto y el ci.yml tiene que pasarlo en 'secrets'"; fallo=1; }
          exit "$fallo"

      - name: Recuperar la web compilada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web

      - name: Conectar a Tailscale (nodo efímero con tag:ci)
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ inputs.ts-oauth-client-id }}
          audience: ${{ inputs.ts-audience }}
          tags: tag:ci
          # El DNS de la tailnet es Pi-hole y tag:ci solo llega al puerto 22: se conecta por IP.
          args: --accept-dns=false
          ping: ${{ inputs.deploy-host }}

      - name: Preparar SSH
        env:
          HOST: ${{ inputs.deploy-host }}
          KNOWN_HOSTS: ${{ inputs.known-hosts }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          # Sin retornos de carro y con un único salto de línea final, como espera OpenSSH.
          clave=${KEY//$'\r'/}
          while [[ $clave == *$'\n' ]]; do clave=${clave%$'\n'}; done
          printf '%s\n' "$clave" > ~/.ssh/forge_despliegue
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts_forge
          cat > ~/.ssh/config <<EOF
          Host forge
            HostName $HOST
            User deploy
            IdentityFile ~/.ssh/forge_despliegue
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts_forge
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
          EOF
          echo "Huella de la clave de despliegue: $(ssh-keygen -y -f ~/.ssh/forge_despliegue | ssh-keygen -lf - | cut -d' ' -f2)"

      - name: Subir la web y pedir la activación
        env:
          SITE: ${{ inputs.site }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          nombre="$SITE.$SHA"
          # La Pi solo acepta escritura en /srv/deploy (rrsync -wo -no-del): ni lee ni borra.
          rsync -rt --chmod=D755,F644 --stats web/ "forge:entrante/$nombre/"
          # La petición se sube después del contenido. --inplace: aparece ya con su nombre,
          # sin fichero temporal que la unidad .path pudiera ver antes de tiempo.
          mkdir -p peticion
          : > "peticion/$nombre"
          rsync -t --inplace "peticion/$nombre" forge:peticiones/
          echo "Subida $nombre; la Pi la activa y avisa por ntfy"

      - name: Comprobar desde Internet
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url=${URL%/}
          intentos=30
          for ((i = 1; i <= intentos; i++)); do
            # El parámetro distinto en cada intento evita respuestas en caché de Cloudflare.
            commit=$(curl -fsS --max-time 10 "$url/version.json?ci=$GITHUB_RUN_ID-$i" | jq -r '.commit // empty' 2>/dev/null || true)
            if [[ $commit == "$SHA" ]]; then
              echo "Versión ${SHA:0:7} publicada en $url (intento $i)"
              break
            fi
            if ((i == intentos)); then
              echo "::error::Tras $((intentos * 5)) s, $url/version.json no tiene el commit ${SHA:0:7} (tiene: ${commit:-nada}). Mira el aviso de ntfy y 'journalctl -u forge-desplegar' en la Pi"
              exit 1
            fi
            sleep 5
          done
          cabeceras=$(curl -fsS --max-time 10 -o /dev/null -D - "$url/")
          fallo=0
          for c in 'x-content-type-options: nosniff' 'x-frame-options: deny' 'referrer-policy: strict-origin-when-cross-origin' 'permissions-policy:'; do
            if ! grep -qi "^$c" <<< "$cabeceras"; then
              echo "::error::Falta la cabecera '$c'"
              fallo=1
            fi
          done
          if ((fallo == 0)); then echo "Cabeceras de seguridad presentes; certificado válido (curl lo verifica)"; fi
          exit "$fallo"
